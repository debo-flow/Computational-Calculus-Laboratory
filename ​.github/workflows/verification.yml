name: Mathematical Verification & Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sympy numpy scipy matplotlib pytest
        
    - name: Run Core Mathematical Regression Tests
      run: |
        pytest tests/ -m "not benchmark" --maxfail=10 --disable-warnings
        
    - name: Execute Scientific Benchmarks
      run: |
        # Separated from CI pass/fail to avoid breaking on timeout limits
        python -c "import pytest; pytest.main(['tests/', '-m', 'benchmark'])" || true
